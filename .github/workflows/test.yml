name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# un nuovo push sulla stessa PR annulla il giro precedente
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Le modifiche alla sola documentazione non toccano i test: se la PR (o il push) cambia
  # soltanto docs/, file .md o LICENSE, la matrice si salta. Nel dubbio (base sconosciuta,
  # errore di git) i test partono comunque.
  modifiche:
    runs-on: ubuntu-latest
    outputs:
      codice: ${{ steps.diff.outputs.codice }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: File di codice cambiati?
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          codice=true
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
             && cambiati=$(git diff --name-only "$BASE" HEAD); then
            echo "File cambiati:"; echo "$cambiati"
            if ! echo "$cambiati" | grep -q -v -E '^docs/|\.md$|^LICENSE$'; then
              codice=false
            fi
          fi
          echo "codice=$codice" | tee -a "$GITHUB_OUTPUT"

  pytest:
    needs: modifiche
    if: needs.modifiche.outputs.codice == 'true'
    # I test non caricano modelli: bastano l'extra "dev" (pytest, numpy) e ffmpeg,
    # senza i ~2 GB dell'extra "separa-parlato".
    # Windows con una sola versione di Python: basta a scoprire percorsi e segnali diversi da Linux.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Installazione
        run: |
          uv venv -p ${{ matrix.python }}
          uv pip install -e '.[dev]'

      - name: casoweb --help senza gli extra
        run: uv run --no-sync casoweb --help && uv run --no-sync casoweb separa-parlato --help > /dev/null

      - name: pytest
        # -ra elenca i test saltati: se mancasse ffmpeg si vedrebbe subito
        run: uv run --no-sync pytest -ra

  # Unico controllo richiesto dalla regola su main: non va ritoccata se cambia la matrice.
  esito:
    name: test
    if: always()
    # "skipped" è accettato solo se è stato "modifiche" a dire che non c'è codice da provare
    needs: [modifiche, pytest]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.pytest.result }}" = success || {
            test "${{ needs.modifiche.result }}" = success &&
            test "${{ needs.modifiche.outputs.codice }}" = false &&
            test "${{ needs.pytest.result }}" = skipped
          }
